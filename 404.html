<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Page not found · Mohammed Ali Salim</title>
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' font-family='Arial,sans-serif' font-weight='800' fill='%2300e5ff'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        linear-gradient(rgba(0,229,255,0.06) 1px, transparent 1px) 0 0 / 60px 60px,
        linear-gradient(90deg, rgba(0,229,255,0.06) 1px, transparent 1px) 0 0 / 60px 60px,
        radial-gradient(ellipse at 20% 10%, rgba(0,229,255,0.10), transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(108,92,231,0.10), transparent 55%),
        #070b14;
      color: #e6f1ff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }
    .orb {
      position: fixed; pointer-events: none;
      border-radius: 50%;
      filter: blur(60px);
      mix-blend-mode: screen;
      animation: orbFloat 18s ease-in-out infinite;
    }
    .orb-a { width: 480px; height: 480px; top: -120px; left: -120px;
      background: radial-gradient(circle, #00e5ff, transparent 70%); opacity: 0.4; }
    .orb-b { width: 520px; height: 520px; bottom: -160px; right: -160px;
      background: radial-gradient(circle, #6c5ce7, transparent 70%); opacity: 0.4;
      animation-direction: reverse; }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(40px,-30px) scale(1.05); }
    }

    .panel {
      max-width: 640px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .glitch {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(6rem, 24vw, 11rem);
      line-height: 1;
      background: linear-gradient(135deg, #00e5ff 0%, #6c5ce7 50%, #ff3df8 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      letter-spacing: -2px;
      filter: drop-shadow(0 0 40px rgba(0,229,255,0.25));
      animation: glitchIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes glitchIn {
      0%   { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: #00e5ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0; animation: fade 0.6s 0.4s both;
    }
    .eyebrow::before { content: ''; width: 24px; height: 2px;
      background: linear-gradient(90deg, #00e5ff, #6c5ce7); border-radius: 2px; }
    .heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      margin: 12px 0 14px;
      opacity: 0; animation: fade 0.6s 0.5s both;
    }
    .sub {
      color: #a8b8d3;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 36px;
      max-width: 480px;
      margin-inline: auto;
      opacity: 0; animation: fade 0.6s 0.6s both;
    }
    @keyframes fade { to { opacity: 1; } }
    .actions {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      opacity: 0; animation: fade 0.6s 0.7s both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: 600; font-size: 0.92rem;
      text-decoration: none;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary {
      background: linear-gradient(135deg, #00e5ff 0%, #6c5ce7 50%, #ff3df8 100%);
      color: #00131a;
      box-shadow: 0 0 28px rgba(0,229,255,0.28);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(0,229,255,0.45); }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      color: #e6f1ff;
      backdrop-filter: blur(12px);
    }
    .btn-ghost:hover {
      border-color: rgba(0,229,255,0.22);
      color: #00e5ff;
      transform: translateY(-3px);
    }
    .hint {
      margin-top: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #6b7a99;
      opacity: 0; animation: fade 0.6s 0.9s both;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <main class="panel" role="main">
    <div class="glitch" aria-label="404">404</div>
    <div class="eyebrow">Lost in the stack</div>
    <h1 class="heading">This page took a wrong turn.</h1>
    <p class="sub">The URL you tried to reach doesn't exist on this site — but the rest of the portfolio is alive and well. Let's get you back on track.</p>
    <div class="actions">
      <a href="./" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"/></svg>
        Back home
      </a>
      <a href="./#contact" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Get in touch
      </a>
    </div>
    <div class="hint">// status: 404 · code: ENOENT · suggestion: head home</div>
  </main>
</body>
</html>
